name: atm-cyber-range-secure

services:
  atm-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atm-lab-secure
    ports:
      - "8080:8080"
    environment:
      - SECURE_MODE=true
      - DB_PATH=/app/data/atm.db
    volumes:
      - atm_data_secure:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v1/mode')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  atm_data_secure:
