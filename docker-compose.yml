name: cyber-range-platform

services:
  range-manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
    container_name: cyber-range-manager
    ports:
      - "9000:9000"
    environment:
      - MANAGER_DB_PATH=/app/data/manager.db
    volumes:
      - manager_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/api/v1/services')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  atm-lab:
    build:
      context: ./labs/atm
      dockerfile: Dockerfile
    container_name: atm-lab-container
    ports:
      - "8080:8080"
    environment:
      - DIFFICULTY_LEVEL=beginner
      - SECURE_MODE=false
      - DB_PATH=/app/data/atm.db
    volumes:
      - atm_data:/app/data
    restart: unless-stopped

  bank-lab:
    build:
      context: ./labs/bank
      dockerfile: Dockerfile
    container_name: bank-lab-container
    ports:
      - "8081:8081"
    environment:
      - DIFFICULTY_LEVEL=intermediate
      - SECURE_MODE=false
      - DB_PATH=/app/data/bank.db
    volumes:
      - bank_data:/app/data
    restart: unless-stopped

  isp-lab:
    build:
      context: ./labs/isp
      dockerfile: Dockerfile
    container_name: isp-lab-container
    ports:
      - "8082:8082"
    environment:
      - DIFFICULTY_LEVEL=advanced
      - SECURE_MODE=false
      - DB_PATH=/app/data/isp.db
    volumes:
      - isp_data:/app/data
    restart: unless-stopped

  school-lab:
    build:
      context: ./labs/school
      dockerfile: Dockerfile
    container_name: school-lab-container
    ports:
      - "8083:8083"
    environment:
      - DIFFICULTY_LEVEL=beginner
      - SECURE_MODE=false
      - DB_PATH=/app/data/school.db
    volumes:
      - school_data:/app/data
    restart: unless-stopped

  shop-lab:
    build:
      context: ./labs/shop
      dockerfile: Dockerfile
    container_name: shop-lab-container
    ports:
      - "8084:8084"
    environment:
      - DIFFICULTY_LEVEL=intermediate
      - SECURE_MODE=false
      - DB_PATH=/app/data/shop.db
    volumes:
      - shop_data:/app/data
    restart: unless-stopped

  mobile-lab:
    build:
      context: ./labs/mobile
      dockerfile: Dockerfile
    container_name: mobile-lab-container
    ports:
      - "8085:8085"
    environment:
      - DIFFICULTY_LEVEL=beginner
      - SECURE_MODE=false
      - DB_PATH=/app/data/mobile.db
    volumes:
      - mobile_data:/app/data
    restart: unless-stopped

  wave-lab:
    build:
      context: ./labs/wave
      dockerfile: Dockerfile
    container_name: wave-lab-container
    ports:
      - "8086:8086"
    environment:
      - DIFFICULTY_LEVEL=beginner
      - SECURE_MODE=false
      - DB_PATH=/app/data/wave.db
    volumes:
      - wave_data:/app/data
    restart: unless-stopped

  snmp-lab:
    build:
      context: ./labs/snmp
      dockerfile: Dockerfile
    container_name: snmp-lab-container
    ports:
      - "8087:8087"
      - "16161:16161/udp"
    environment:
      - DIFFICULTY_LEVEL=beginner
      - SECURE_MODE=false
      - DB_PATH=/app/data/snmp.db
    volumes:
      - snmp_data:/app/data
    restart: unless-stopped

  ssh-lab:
    build:
      context: ./labs/ssh
      dockerfile: Dockerfile
    container_name: ssh-lab-container
    ports:
      - "8088:8088"
      - "2222:2222"
    environment:
      - DIFFICULTY_LEVEL=beginner
      - SECURE_MODE=false
      - DB_PATH=/app/data/ssh.db
    volumes:
      - ssh_data:/app/data
    restart: unless-stopped

  apiwarehouse-lab:
    build:
      context: ./labs/apiwarehouse
      dockerfile: Dockerfile
    container_name: apiwarehouse-lab-container
    ports:
      - "8089:8089"
    environment:
      - DIFFICULTY_LEVEL=beginner
      - SECURE_MODE=false
      - DB_PATH=/app/data/apiwarehouse.db
    volumes:
      - apiwarehouse_data:/app/data
    restart: unless-stopped

volumes:
  manager_data:
  atm_data:
  bank_data:
  isp_data:
  school_data:
  shop_data:
  mobile_data:
  wave_data:
  snmp_data:
  ssh_data:
  apiwarehouse_data:
